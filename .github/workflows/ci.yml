name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]  

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `mujoco` covers the optional MuJoCo backend; the py3xx envs deliberately do not
        # have it installed, which also keeps the optional-dependency guard under test
        environment: [py310, py311, py312, mujoco]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # cache: true
          # frozen: true
          environments: ${{ matrix.environment }}
      - name: CI
        run: |
          pixi run -e ${{ matrix.environment }} ci 
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
